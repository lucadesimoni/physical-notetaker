# Voxtral Notetaker configuration
#
# On the device, use the web page (http://<device>:8080 -> Settings) instead of
# editing this file. To edit by hand: copy to config.yaml and change what you need.
# Every setting is optional; missing ones use the defaults shown here.

# Microphone
audio:
  sample_rate: 16000      # Hz; 16000 is ideal for speech
  channels: 1             # 1 = mono
  device_index: null      # null = auto-detect (prefers Jabra / conference mics)
  noise_reduction: true   # applied after the meeting, needs the noisereduce package

# Mistral Voxtral transcription (https://docs.mistral.ai/studio/audio/overview)
voxtral:
  api_key: ""             # Mistral API key, or set the MISTRAL_API_KEY environment variable
  base_url: "https://api.mistral.ai/v1"
  model: "voxtral-small-transcribe-3-0"      # Accurate: final transcript, memo, speakers
  fast_model: "voxtral-mini-transcribe-3-0"  # Fast/cheap: interim transcripts ("Moment bitte")
  timeout: 30             # seconds per request
  max_retries: 3          # quick retries on rate limits / server errors

# Speaker recognition
diarization:
  enabled: true
  provider: mistral       # mistral (API, no local model) or pyannote (local)
  max_speakers: 10        # pyannote only
  hf_token: null          # pyannote only: Hugging Face token (or HF_TOKEN env var)
  detect_names: true      # name speakers from "Ich bin Anna" / "My name is Tom"

# AI summary in the memo (OpenAI-compatible chat API)
summary:
  enabled: true
  model: "mistral-small-2603"  # Mistral Small 4
  base_url: null          # defaults to voxtral.base_url
  api_key: null           # defaults to voxtral.api_key
  max_points: 8           # bullet points in the summary
  timeout: 60

# Email the memo after each meeting
email:
  enabled: false
  to_emails: []           # e.g. ["team@example.com", "anna@example.com"]
  smtp_host: ""           # e.g. smtp.gmail.com, smtp.office365.com
  smtp_port: 587          # 587 = STARTTLS, 465 = SSL
  smtp_user: ""
  smtp_password: ""       # or the NOTETAKER_SMTP_PASSWORD environment variable
  use_tls: true           # STARTTLS on port 587
  from_email: ""          # defaults to smtp_user
  attach_transcript: true
  attach_audio: false     # recordings are large; attachments over 15 MB are skipped

# Copies of recordings, transcripts and memos
storage:
  provider: local         # local, google_drive, dropbox, s3, all
  local_path: "./recordings"
  google_credentials: null  # path to an authorized-user credentials JSON
  google_folder_id: null
  dropbox_token: null
  dropbox_folder: "/VoxtralNotetaker"
  s3_bucket: null
  s3_region: "eu-central-1"
  s3_access_key: null
  s3_secret_key: null
  auto_upload: true

# Buttons, sounds and status light
device:
  beeps: true             # tones through the speakerphone
  beep_volume: 0.3
  voice: true             # spoken announcements ("Aufnahme gestartet…"), needs espeak-ng
  piper_model: ""         # optional: path to a Piper voice (.onnx) for a more natural voice
  long_press_seconds: 3.0 # hold the button this long: the device says its address
  button_gpio: null       # GPIO pin of a start/stop push button (to GND), e.g. 17
  led_gpio: null          # GPIO pin of a status LED, e.g. 27
  input_device: "jabra"   # USB device whose buttons start/stop ("" = off)
  input_keys: ["KEY_PHONE", "KEY_PLAYPAUSE"]

# Background service
service:
  recordings_dir: "./recordings"
  language: auto          # meeting language: auto, de-CH, de, en
  ui_language: de         # web page and announcements: de or en
  retry_interval_seconds: 300  # first retry when offline; doubles up to 1 hour
  max_attempts: 0         # 0 = keep retrying network problems
  keep_audio_days: 30     # delete audio of finished meetings after N days (0 = never)
  min_free_mb: 500        # keep this much space free: oldest finished audio goes first
  live_commands: true     # confirm voice commands during the meeting ("Notiz notiert")
  live_interval_seconds: 30  # how often the newest audio is checked (fast Mini model)

# Setup and status web page
web:
  enabled: true
  host: "0.0.0.0"
  port: 8080              # the installer sets 80, so the address is just http://notetaker.local
  pin: ""                 # chosen on the first visit to Settings
  setup_hotspot: true     # no network at boot -> open Wi-Fi "Notetaker-Setup"
  hotspot_ssid: "Notetaker-Setup"
  hotspot_password: "notetaker"

max_recording_minutes: 120  # stops and saves automatically (warning beep 5 min before)
