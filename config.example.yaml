# Voxtral Notetaker Configuration
# Copy this file to config.yaml and customize for your setup

# General settings
name: "Voxtral Notetaker"

# Audio Configuration
audio:
  sample_rate: 16000          # Audio sample rate (Hz, 16000 recommended for speech)
  channels: 1               # Number of audio channels (1 = mono, 2 = stereo)
  format: wav              # Audio format: wav, mp3, flac, ogg
  chunk_size: 1024         # Audio chunk size for streaming
  device_index: null       # Specific audio device index (null = auto-detect)
  auto_gain: true          # Enable automatic gain control
  noise_reduction: true   # Enable noise reduction
  enhancement: true        # Enable audio enhancement

# Mistral Voxtral transcription (https://docs.mistral.ai/studio/audio/overview)
voxtral:
  api_key: ""             # Mistral API key, or set the MISTRAL_API_KEY environment variable
  base_url: "https://api.mistral.ai/v1"
  model: "voxtral-small-transcribe-3-0"      # Accurate: final transcript, memo, speakers
  fast_model: "voxtral-mini-transcribe-3-0"  # Fast/cheap: interim transcripts ("Moment bitte")
  timeout: 30             # Request timeout in seconds
  max_retries: 3          # Retries on rate limits / server errors

# Speaker Diarization Configuration
diarization:
  enabled: true           # Enable speaker diarization
  provider: mistral       # mistral (API, no local model) or pyannote (local)
  min_speakers: 1        # Minimum number of speakers to detect
  max_speakers: 10       # Maximum number of speakers to detect
  speaker_change_threshold: 0.7  # Threshold for speaker change detection (0.0 - 1.0)
  overlap_threshold: 0.5  # Threshold for overlapping speech detection
  use_pyannote: true      # Use pyannote.audio for diarization
  hf_token: null          # Hugging Face token for pyannote models (or set HF_TOKEN env var)

# Meeting memo AI summary (OpenAI-compatible chat API, e.g. Mistral)
summary:
  enabled: true
  model: "mistral-small-2603"  # Mistral Small 4
  base_url: null          # defaults to voxtral.base_url
  api_key: null           # defaults to voxtral.api_key
  max_points: 8           # maximum bullet points in the summary
  timeout: 60

# Cloud Storage Configuration
storage:
  provider: local        # Storage provider: local, google_drive, dropbox, s3, all
  local_path: "./recordings"  # Local storage path
  
  # Google Drive settings
  google_credentials: null  # Path to Google credentials JSON file
  google_folder_id: null   # Google Drive folder ID
  
  # Dropbox settings
  dropbox_token: null      # Dropbox access token
  dropbox_folder: "/VoxtralNotetaker"  # Dropbox folder path
  
  # Amazon S3 settings
  s3_bucket: null          # S3 bucket name
  s3_region: "eu-central-1"  # S3 region
  s3_access_key: null     # S3 access key
  s3_secret_key: null     # S3 secret key
  
  auto_upload: true       # Automatically upload to cloud
  retain_local: true      # Keep local copy after upload

# Email Configuration
email:
  enabled: true           # Enable email sending
  smtp_host: "smtp.gmail.com"  # SMTP server host
  smtp_port: 587          # SMTP server port
  smtp_user: null         # SMTP username
  smtp_password: null     # SMTP password (use app password for Gmail)
  use_tls: true           # Use TLS encryption
  
  from_email: "notetaker@voxtral.local"  # Sender email address
  to_emails: []           # List of recipient email addresses
  cc_emails: []           # List of CC email addresses
  bcc_emails: []          # List of BCC email addresses
  
  subject_template: "Meeting Notes - {date}"  # Email subject template
  body_template: "Please find attached the meeting notes from {date}.\n\n{transcript}"  # Email body template
  
  send_audio: false        # Send audio file as attachment
  send_transcript: true    # Send transcript as attachment
  send_notes: true         # Send formatted notes as attachment

# Performance settings
max_recording_hours: 8    # Maximum recording duration in hours
auto_split_minutes: 30   # Automatically split recordings every N minutes

# Logging settings
log_level: "INFO"         # Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_file: "voxtral_notetaker.log"  # Log file path
