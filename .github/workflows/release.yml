#
# Publish a release, either by pushing a version tag (v1.1.0, ...) or with
# "Run workflow" on GitHub (Actions -> Release), which releases the version in
# voxtral_notetaker/__init__.py and creates its tag:
#   1. build the downloads (Windows ZIP, Raspberry Pi archive, Python package)
#   2. test the actual Windows ZIP on Windows and the actual Pi archive on ARM
#   3. publish the GitHub release only if both pass
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version to release
        id: version
        run: |
          VERSION="$(python -c 'import re; print(re.search(r"^__version__ = \"([^\"]+)\"", open("voxtral_notetaker/__init__.py").read(), re.M).group(1))')"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="v$VERSION"; fi
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match the version $VERSION in the code" >&2; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null && [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "$TAG already exists: raise the version in voxtral_notetaker/__init__.py" >&2; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"
      - name: Build downloads
        run: |
          python -m pip install --quiet build
          python scripts/package_release.py
          python -m build --outdir dist .
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-windows-zip:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unzip like a user would
        shell: powershell
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: Expand-Archive -Path "notetaker-windows-$env:TAG.zip" -DestinationPath user
      - name: Set up from the ZIP (the starter behind "Notetaker starten.bat")
        shell: cmd
        env:
          NOTETAKER_SETUP_ONLY: "1"
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          cd user\notetaker-%TAG%
          powershell -NoProfile -ExecutionPolicy Bypass -File windows\start-notetaker.ps1
      - name: Use it (real service, web page, Windows voice)
        shell: cmd
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          cd user\notetaker-%TAG%
          venv\Scripts\python windows\smoke_test.py

  windows-installer:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Notetaker-Setup.exe from the release ZIP (signed when a certificate is set)
        shell: pwsh
        env:
          TAG: ${{ needs.build.outputs.tag }}
          # Optional repository secrets for code signing (Settings -> Secrets -> Actions):
          #   WINDOWS_SIGN_PFX_BASE64  the .pfx certificate, base64 encoded
          #   WINDOWS_SIGN_PFX_PASSWORD  its password
          SIGN_PFX: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          Expand-Archive -Path "notetaker-windows-$env:TAG.zip" -DestinationPath staging
          $src = "$PWD\staging\notetaker-$env:TAG"
          $version = $env:TAG.TrimStart('v')
          $inno = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (-not (Test-Path "$inno\ISCC.exe")) { choco install innosetup -y --no-progress | Out-Null }
          $isccArgs = @("/Q", "/DAppVersion=$version", "/DSourceRoot=$src", "/DOutputDir=$PWD\installer")
          if ($env:SIGN_PFX) {
            $pfx = "$env:RUNNER_TEMP\sign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX))
            $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
                         Sort-Object FullName | Select-Object -Last 1).FullName
            $isccArgs += "/DSign"
            $isccArgs += "/Ssigntool=`"$signtool`" sign /f `$q$pfx`$q /p `$q$env:SIGN_PASSWORD`$q /fd sha256 /tr http://timestamp.digicert.com /td sha256 `$f"
            "Signing with the certificate from the repository secrets"
          } else {
            "No signing certificate set: the installer is unsigned (Windows shows 'Unknown publisher')"
          }
          & "$inno\ISCC.exe" @isccArgs "$src\windows\notetaker.iss"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem installer | Format-Table Name, Length
      - name: Install silently, use it, uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer\Notetaker-Setup-*.exe).FullName
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $app = "$env:LOCALAPPDATA\Programs\Notetaker"
          $env:NOTETAKER_SETUP_ONLY = "1"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$app\windows\start-notetaker.ps1"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item env:NOTETAKER_SETUP_ONLY
          & "$app\venv\Scripts\python.exe" "$app\windows\smoke_test.py"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer/

  test-pi-archive:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - name: Unpack and install like a user would
        env:
          NOTETAKER_HOSTNAME: notetaker
          NOTETAKER_SKIP_NETWORK_MANAGER: "1"
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          tar xzf "notetaker-raspberry-pi-${TAG}.tar.gz"
          cd "notetaker-${TAG}"
          sudo -E ./install.sh
      - name: Use it (service, web page, PIN rules, restart)
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          cd "notetaker-${TAG}"
          ./deploy/smoke_test.sh

  publish:
    needs: [build, test-windows-zip, windows-installer, test-pi-archive]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          awk -v v="## $VERSION" '$0 ~ "^"v {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "Release $TAG" > notes.md
          cat notes.md
      - name: Publish the GitHub release (creates the tag if it does not exist yet)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
            --title "Notetaker $TAG" --notes-file notes.md
